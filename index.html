<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0C0C0E" media="(prefers-color-scheme: dark)" />

    <title>Relivance — Your network is bigger than your memory.</title>
    <meta
      name="description"
      content="Relivance is a premium relationship-intelligence app for iOS. Private early access is opening soon."
    />

    <!-- Open Graph / social previews. iMessage (and most other rich-link
         scrapers) need a RASTER og:image — SVGs are silently ignored.
         The 1200×630 PNG is what iMessage renders above the title +
         description on the Rich Link card. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Relivance" />
    <meta property="og:title" content="Relivance" />
    <meta
      property="og:description"
      content="Your network is bigger than your memory."
    />
    <meta property="og:url" content="https://relivance.app/" />
    <meta property="og:image" content="https://relivance.app/assets/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Relivance. Your network is bigger than your memory."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Relivance" />
    <meta
      name="twitter:description"
      content="Your network is bigger than your memory."
    />
    <meta name="twitter:image" content="https://relivance.app/assets/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Relivance. Your network is bigger than your memory."
    />

    <!-- Favicon + iOS home-screen icon. Keep the SVG favicon for modern
         desktop browsers (sharp at any size), but ship a 180×180 PNG
         for iOS home-screen bookmarks and Safari's share UI — those
         surfaces can't read SVGs. -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png" />

    <!-- Roboto, self-hosted (Apache 2.0). See styles.css @font-face block.
         Preload the latin subset because every page renders English copy
         first; latin-ext loads on-demand when the browser actually
         encounters a glyph it covers (umlauts, ß, etc.). -->
    <link
      rel="preload"
      href="assets/fonts/roboto-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="stage" role="main">
      <section class="brand" aria-label="Relivance brand">
        <picture class="logo" aria-hidden="true">
          <source srcset="assets/logo-dark.svg" media="(prefers-color-scheme: dark)" />
          <img src="assets/logo-light.svg" alt="" width="160" height="160" />
        </picture>

        <h1 class="wordmark">Relivance</h1>

        <p class="slogan">Your network is bigger than your memory.</p>
      </section>

      <section class="access" aria-labelledby="access-heading">
        <p id="access-heading" class="access-heading">
          Private early access is opening soon.
        </p>

        <!--
          =====================================================================
          FORMSPREE ENDPOINT — REPLACE BEFORE GOING LIVE
          =====================================================================
          The `action` URL below is a placeholder. Sign up at
          https://formspree.io, create a new form, and copy the form's
          endpoint URL (it looks like https://formspree.io/f/abcd1234)
          into the `action` attribute below. Nothing else needs to change.

          Why Formspree: works on a static GitHub Pages site (no backend),
          has a generous free tier, sends email submissions to you, no
          tracking by default, lets you wire up Mailchimp / ConvertKit /
          Loops later without changing the form's HTML.

          Alternatives that drop in the same way (just swap the action URL):
            • Getform     https://getform.io/
            • Web3Forms   https://web3forms.com/
            • Buttondown  https://buttondown.email/api  (their forms are slightly different)

          The fetch handler below treats any 2xx response as success and
          shows the success state inline (no page redirect). The form
          gracefully degrades to a normal POST + Formspree's hosted
          confirmation page if JavaScript is disabled.
          =====================================================================
        -->
        <form
          class="access-form"
          id="access-form"
          action="https://formspree.io/f/mlgzaybw"
          method="POST"
          novalidate
        >
          <label for="email" class="visually-hidden">Email Address</label>
          <input
            id="email"
            name="email"
            type="email"
            inputmode="email"
            autocomplete="email"
            placeholder="Email Address"
            required
            aria-describedby="access-error"
            class="access-input"
          />
          <button type="submit" class="access-submit">
            <span class="access-submit-label">Request Early Access</span>
            <span class="access-submit-spinner" aria-hidden="true"></span>
            <span class="access-submit-success" aria-hidden="true">
              Success
              <svg
                viewBox="0 0 16 16"
                width="18"
                height="18"
                role="img"
                aria-label="Success"
              >
                <!--
                  SF Symbol "checkmark.circle.fill" replicated in SVG.
                  White filled disc; the checkmark is the disc's
                  cutout, so the button's accent-blue background
                  shows through inside the checkmark shape — exactly
                  how the SF Symbol renders when tinted white over a
                  coloured surface in iOS.
                -->
                <path
                  fill="#ffffff"
                  fill-rule="evenodd"
                  clip-rule="evenodd"
                  d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16Zm-.81-4.71 4.79-5.6-.99-.85-4.13 4.83-2.13-2.13-.99.99 2.71 2.71.39.39.35-.34Z"
                />
              </svg>
            </span>
          </button>

          <p id="access-error" class="access-error" role="alert" hidden></p>
        </form>

        <!--
          Visually-hidden live region for screen readers. The visible
          success state lives inside the button itself, but assistive
          tech doesn't always announce a button label changing. This
          polite live region announces "You're on the early access
          list." when the form transitions to its success state.
        -->
        <p id="access-success" class="visually-hidden" role="status" aria-live="polite"></p>
      </section>
    </main>

    <footer class="footer">
      <small class="footer-copy">&copy; <span id="year">2026</span> Relivance LLC</small>
      <span class="footer-sep" aria-hidden="true">•</span>
      <nav class="footer-nav" aria-label="Legal">
        <a href="/privacy/">Privacy</a>
        <span class="footer-sep" aria-hidden="true">•</span>
        <a href="/terms/">Terms</a>
        <span class="footer-sep" aria-hidden="true">•</span>
        <a href="/impressum/">Impressum</a>
      </nav>
    </footer>

    <script>
      // Year auto-roll. Stays cheap and dependency-free.
      document.getElementById("year").textContent = new Date().getFullYear();

      // ─── Early-access form ──────────────────────────────────────────────
      //
      // Submits via fetch so the success state can render inline, keeping
      // the visitor on the page. If JS is disabled or the fetch fails to
      // initiate, the form falls back to a normal POST to the endpoint —
      // Formspree's hosted confirmation page handles that case for free.
      //
      // We deliberately do NOT pre-validate beyond "non-empty + looks like
      // an email": Formspree (and the user's email provider) does the real
      // check. Over-validation client-side is hostile (e.g. valid
      // jane@cs.cam.ac.uk emails get rejected by overly-strict regexes).
      //
      (function () {
        const form = document.getElementById("access-form");
        const emailInput = document.getElementById("email");
        const errorEl = document.getElementById("access-error");
        const successEl = document.getElementById("access-success");
        if (!form || !emailInput) return;

        // Loose RFC-flavoured pattern: something@something.tld. Permissive
        // by design so we don't false-reject legitimate addresses; the
        // server-side will do the strict check.
        const EMAIL_PATTERN = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        const setError = function (msg) {
          errorEl.textContent = msg;
          errorEl.hidden = !msg;
          emailInput.setAttribute("aria-invalid", msg ? "true" : "false");
        };

        const showSuccess = function () {
          // Lock the form into the success state without removing it:
          // input greys out + disables, button morphs to the
          // "Success ✓" treatment. The whole form stays on screen
          // so the user sees the locked-in email they just submitted.
          form.setAttribute("data-state", "success");
          emailInput.disabled = true;
          emailInput.readOnly = true;
          // Announce via the visually-hidden live region for SR users.
          successEl.textContent = "You’re on the early access list.";
        };

        form.addEventListener("submit", async function (event) {
          // If the action URL is still the placeholder, prevent submission
          // and surface a friendly error during local development so the
          // dev knows to wire up Formspree before going live.
          if (form.action.includes("REPLACE_WITH_YOUR_FORMSPREE_ID")) {
            event.preventDefault();
            setError("Form endpoint not configured yet.");
            return;
          }

          const email = (emailInput.value || "").trim();
          if (email.length === 0 || !EMAIL_PATTERN.test(email)) {
            event.preventDefault();
            setError("Please enter a valid email address.");
            return;
          }

          // Hand the submission to fetch so we can render the success
          // state inline instead of redirecting. event.preventDefault is
          // intentionally INSIDE the try so a network failure still falls
          // back to the native form POST (Formspree's hosted confirm
          // page renders something sensible for the user).
          let usedFetch = false;
          try {
            event.preventDefault();
            usedFetch = true;
            setError("");
            form.setAttribute("data-state", "submitting");
            const response = await fetch(form.action, {
              method: "POST",
              headers: { Accept: "application/json" },
              body: new FormData(form)
            });
            form.removeAttribute("data-state");
            if (response.ok) {
              showSuccess();
            } else {
              setError("Something went wrong. Please try again in a moment.");
            }
          } catch (err) {
            form.removeAttribute("data-state");
            if (usedFetch) {
              setError("Network error. Please try again in a moment.");
            }
            // If fetch never started (e.g. CSP block), the browser falls
            // back to the normal form POST automatically.
          }
        });

        // Clear errors as the user types so the inline error doesn't
        // linger after they've already started fixing the input.
        emailInput.addEventListener("input", function () {
          if (errorEl.hidden) return;
          setError("");
        });
      })();
    </script>
  </body>
</html>
